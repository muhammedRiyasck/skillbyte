
name: SkillByte CI/CD

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      # Get the latest source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Prepare Docker image builder
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate with Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and upload frontend image
      - name: Build and push client
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/skillbyte-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/skillbyte-client:${{ github.sha }}
          build-args: |
            VITE_API_URL=/api/v1
            VITE_API_BASE_URL=https://skillbyte.site
            VITE_APP_URL=https://skillbyte.site

      # Build and upload backend image
      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/skillbyte-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/skillbyte-server:${{ github.sha }}

  deploy:
    name: Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            cd /home/ubuntu/Skillbyte

            export IMAGE_TAG="$IMAGE_TAG"

            docker compose pull

            docker compose up -d --remove-orphans

            docker image prune -f
